# Dev/test stack: Redis + Postgres (internal bridge only), worker, API + web UI.
# Only the API (8080) and the web UI (3000) are reachable from the host.
services:
  redis:
    image: redis:7-alpine
    # No host ports — reachable only by service name on the bridge network.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minos-secret}
      POSTGRES_DB: ${POSTGRES_DB:-minos}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minos} -d ${POSTGRES_DB:-minos}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    # nsjail needs these to create namespaces (same as tested/docker-compose.yml)
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    environment:
      REDIS_ADDR: redis:6379
      CONCURRENCY: ${CONCURRENCY:-4}
      TMP_DIR: /tmp/minos
      NSJAIL_BIN: /usr/local/bin/nsjail
      LOG_LEVEL: info
      # Jail network isolation: off by default to match the proven tested/
      # config. Set to "true" on runc/bare-metal for a network-less jail.
      NSJAIL_CLONE_NEWNET: "false"
      NSJAIL_CLONE_NEWPID: "false"
      NSJAIL_CLONE_NEWCGROUP: "false"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LISTEN_ADDR: :8080
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-minos}:${POSTGRES_PASSWORD:-minos-secret}@postgres:5432/${POSTGRES_DB:-minos}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      SUBMISSION_RETENTION_DAYS: ${SUBMISSION_RETENTION_DAYS:-30}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-1h}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Web UI: static frontend served by Caddy. No proxy; the frontend calls the
  # API directly (VITE_API_BASE) and the API's CORS middleware allows it.
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://127.0.0.1:8080}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
