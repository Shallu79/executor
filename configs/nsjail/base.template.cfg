# Base nsjail config template (Go text/template), rendered per job+phase by
# the worker. Structure mirrors the proven tested/nsjail-gvisor.cfg with
# bind-mounted /proc and scalar rlimits.
mode: ONCE
hostname: "executor-{{.Name}}"
cwd: "/app"
time_limit: {{.TimeLimit}}
max_cpus: 1

clone_newnet: {{.CloneNewNet}}
clone_newpid: {{.CloneNewPID}}
clone_newcgroup: {{.CloneNewCgroup}}
keep_caps: true

uidmap {
    inside_id: "0"
    outside_id: "0"
    count: 1
}

gidmap {
    inside_id: "0"
    outside_id: "0"
    count: 1
}

mount {
    src: "/"
    dst: "/"
    is_bind: true
    mandatory: true
    rw: false
}

mount {
    src: "/proc"
    dst: "/proc"
    is_bind: true
    mandatory: true
    rw: false
}

# The only writable location in the jail.
mount {
    src: "{{.AppDir}}"
    dst: "/app"
    is_bind: true
    mandatory: true
    rw: true
}
{{- range .Env}}

envar: "{{.}}"
{{- end}}

rlimit_as: {{.Memory}}
rlimit_cpu: {{.TimeLimit}}
rlimit_nproc: {{.MaxProcs}}
rlimit_fsize: {{.MaxFileSize}}

exec_bin {
    path: "{{.ExecPath}}"
{{- range .ExecArgs}}
    arg: "{{.}}"
{{- end}}
}
